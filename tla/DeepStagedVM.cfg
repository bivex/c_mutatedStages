\* Exhaustive model-checking configuration.
\* WordWidth = 4 gives 16 x 16 = 256 initial operand pairs, so TLC verifies
\* the full-adder chain and both MBA identities over the COMPLETE input space
\* (every 4-bit operand pair) rather than a single scripted trace.
SPECIFICATION Spec
PROPERTY Termination

INVARIANT TypeOK
INVARIANT BitSliceCorrectness
INVARIANT MBAEquivalence
INVARIANT DataHazardFreedom
INVARIANT CommitIntegrity
INVARIANT StageBoundOK

CONSTANTS
    WordWidth = 4
    FeistelRounds = 4
    MBARounds = 4
    RegCount = 4
    MaxPC = 2
    MaxSteps = 128
